---
extensions:
- ImplicitParams
- MagicHash
- KindSignatures
- ExplicitForAll
modules:
- |
  module Test where
  import GHC.Prim (raise#)
  import GHC.Types (RuntimeRep, TYPE)
  data Message = Message

  failure :: forall (r :: RuntimeRep) (a :: TYPE r). (?message :: Message) => a
  failure = raise# ?message

  data Bool = True | False

  use :: Bool
  use = let ?message = Message in failure
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tLevity :: 3.tType;
    3.tLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.tType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.tType;
    3.tType :: 3.tType;
    3.vBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.vLifted :: 3.tLevity

  import synonyms
    3.tLiftedRep = 3.vBoxedRep 3.vLifted;
    3.tType = 3.tTYPE 3.tLiftedRep

  pub type 1.tMessage :: 3.tType {
      pub 1.vMessage :: 1.tMessage
  }

  pub type 1.tBool :: 3.tType {
      pub 1.vTrue :: 1.tBool;
      pub 1.vFalse :: 1.tBool
  }

  pub val 1.vfailure :: ∀(r : 3.tRuntimeRep) (a : 3.tTYPE r). FUN @3.tLiftedRep @r 1.tMessage a
   = Λ(r : 3.tRuntimeRep).
    Λ(a : 3.tTYPE r).
      λ($d0 : 1.tMessage).
        foreign {prim 2.vraise# :: ∀(r{1} : 3.tRuntimeRep) (a{1} : 3.tType) (b : 3.tTYPE r{1}). FUN @3.tLiftedRep @r{1} a{1} b} @r @1.tMessage @a $d0

  pub val 1.vuse :: 1.tBool
   = let {
      $ipmessage : 1.tMessage =
          1.vMessage
  } in
      1.vfailure @(3.vBoxedRep 3.vLifted) @1.tBool $ipmessage
status: pass
reason: the evidence arrow of an implicit parameter returns a representation-polymorphic body
