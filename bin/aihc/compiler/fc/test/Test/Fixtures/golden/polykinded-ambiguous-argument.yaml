extensions: [PolyKinds, ScopedTypeVariables]
modules:
  - |
    {-# LANGUAGE PolyKinds, ScopedTypeVariables #-}
    module Test where
    data Bool = True | False
    data Proxy (a :: k) = Proxy
    ignore :: forall k (a :: k). Bool
    ignore = True
    result :: Bool
    result = ignore
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Tuple
  scope 3 = "aihc-prim" GHC.Types

  import headers
    3.tLevity :: 3.tType;
    3.tLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.tType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.tType;
    3.tType :: 3.tType;
    2.tUnit :: 3.tType;
    3.vBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.vLifted :: 3.tLevity

  import synonyms
    3.tLiftedRep = 3.vBoxedRep 3.vLifted;
    3.tType = 3.tTYPE 3.tLiftedRep

  pub type 1.tBool :: 3.tType {
      pub 1.vTrue :: 1.tBool;
      pub 1.vFalse :: 1.tBool
  }

  pub type 1.tProxy (k : 3.tType) (a : k) :: 3.tType {
      pub 1.vProxy :: ∀(k : 3.tType) (a : k). 1.tProxy k a
  }

  pub val 1.vignore :: ∀(k : 3.tType) (a : k). 1.tBool
   = Λ(k : 3.tType).
    Λ(a : k).
      1.vTrue

  pub val 1.vresult :: 1.tBool
   = 1.vignore @(3.tTYPE (3.vBoxedRep 3.vLifted)) @2.tUnit
status: pass
reason: Annotation defaulting resolves an argument kind before its type.
