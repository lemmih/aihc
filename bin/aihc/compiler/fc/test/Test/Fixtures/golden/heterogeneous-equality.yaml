extensions: [GADTs, PolyKinds, TypeOperators]
modules:
  - |
    {-# LANGUAGE GADTs, PolyKinds, TypeOperators #-}
    module Test where
    data (a :: k1) :~~: (b :: k2) where
      HRefl :: forall k (a :: k). a :~~: a
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.t[] :: ∀(a : 2.tType). 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity;
    2.vTupleRep :: 2.t[] 2.tRuntimeRep 2.→ 2.tRuntimeRep;
    2.v[] :: ∀(a : 2.tType). 2.t[] a

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.t:~~: (k1 : 2.tType) (k2 : 2.tType) (a : k1) (b : k2) :: 2.tType {
      pub 1.vHRefl :: ∀(k : 2.tType) (a : k) (b : k). FUN @(2.vTupleRep (2.v[] 2.tRuntimeRep)) @2.tLiftedRep (b ~ a) (1.t:~~: k k a b)
  }
status: pass
reason: Heterogeneous equality permits endpoints with distinct kinds.
