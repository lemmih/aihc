extensions: [PolyKinds, RankNTypes, ScopedTypeVariables]
modules:
  - |
    {-# LANGUAGE PolyKinds, RankNTypes, ScopedTypeVariables #-}
    module Test where
    data Bool = True | False
    data Maybe a = Nothing | Just a
    data Proxy (a :: k) = Proxy
    invoke :: (forall k (a :: k). Proxy a -> Bool) -> Bool
    invoke continuation = continuation (Proxy :: Proxy Maybe)
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tBool :: 2.tType {
      pub 1.vTrue :: 1.tBool;
      pub 1.vFalse :: 1.tBool
  }

  pub type 1.tMaybe (a : 2.tType) :: 2.tType {
      pub 1.vNothing :: ∀(a : 2.tType). 1.tMaybe a;
      pub 1.vJust :: ∀(a : 2.tType). a 2.→ 1.tMaybe a
  }

  pub type 1.tProxy (k : 2.tType) (a : k) :: 2.tType {
      pub 1.vProxy :: ∀(k : 2.tType) (a : k). 1.tProxy k a
  }

  pub val 1.vinvoke :: (∀(k : 2.tType) (a : k). 1.tProxy k a 2.→ 1.tBool) 2.→ 1.tBool
   = λ(x : ∀(k : 2.tType) (a : k). 1.tProxy k a 2.→ 1.tBool).
    x @(2.tTYPE (2.vBoxedRep 2.vLifted) 2.→ 2.tTYPE (2.vBoxedRep 2.vLifted)) @1.tMaybe (1.vProxy @(2.tTYPE (2.vBoxedRep 2.vLifted) 2.→ 2.tTYPE (2.vBoxedRep 2.vLifted)) @1.tMaybe)
status: pass
reason: A higher-rank call instantiates each type variable at its declared kind.
