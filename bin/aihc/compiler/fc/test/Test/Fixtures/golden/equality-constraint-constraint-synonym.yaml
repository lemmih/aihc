extensions:
- GADTs
- TypeOperators
- ConstraintKinds
modules:
- |
  module Test where
  data Flag = Off | On
  type Same a b = (a ~ b)
  cast :: Same a b => a -> b
  cast x = x
  result = cast On :: Flag
check-only: true
status: xfail
reason: A constraint synonym preserves equality evidence. AIHC cannot resolve the equality class.
