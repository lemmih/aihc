extensions:
  - ExplicitForAll
  - ForeignFunctionInterface
  - GHCForeignImportPrim
  - KindSignatures
  - MagicHash
modules:
  - |
    module Test where
    import GHC.Types (RuntimeRep, TYPE)
    foreign import prim unsafeCoerce# :: forall (q :: RuntimeRep) (r :: RuntimeRep) (a :: TYPE q) (b :: TYPE r). a -> b
    unsafeCoerce :: a -> b
    unsafeCoerce = unsafeCoerce#
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub val 1.vunsafeCoerce :: ∀(a : 2.tType) (b : 2.tType). a 2.→ b
   = Λ(a : 2.tType).
    Λ(b : 2.tType).
      λ(_foreign_argument : a).
        foreign {prim 1.vunsafeCoerce# :: ∀(q : 2.tRuntimeRep) (r : 2.tRuntimeRep) (a{1} : 2.tTYPE q) (b{1} : 2.tTYPE r). FUN @q @r a{1} b{1}} @(2.vBoxedRep 2.vLifted) @(2.vBoxedRep 2.vLifted) @a @b _foreign_argument
status: pass
reason: A signed polymorphic alias uses its type lambda binders in the right-hand side.
