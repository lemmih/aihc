extensions: []
modules:
  - |
    module Test where
    data Nat = Z | S Nat
    double :: Nat -> Nat
    double n = {-# SCC "double" #-} S n
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub type 1.tNat :: 2.tType {
      pub 1.vZ :: 1.tNat;
      pub 1.vS :: 1.tNat 2.→ 1.tNat
  }

  pub val 1.vdouble :: 1.tNat 2.→ 1.tNat
   = λ(x : 1.tNat).
    1.vS x
status: pass
reason: An SCC pragma on an expression desugars to the wrapped expression.
