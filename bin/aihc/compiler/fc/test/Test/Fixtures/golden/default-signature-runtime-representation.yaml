extensions: [DataKinds, DefaultSignatures, FlexibleInstances, KindSignatures, MultiParamTypeClasses, PolyKinds, TypeOperators]
modules:
  - |
    module Test where

    import GHC.Types (RuntimeRep(..), Levity(..), TYPE)

    data Unit = Unit

    constant :: a -> b -> a
    constant value _ = value

    class Apply (r :: RuntimeRep) (a :: TYPE r) where
      apply :: a -> Unit
      default apply :: r ~ 'BoxedRep 'Lifted => a -> Unit
      apply = constant Unit

    instance Apply ('BoxedRep 'Lifted) Unit
status: pass
reason: A default method uses nominal equality evidence for its type argument kind.
