extensions:
- GADTs
- TypeOperators
modules:
- |
  module Test where
  data Flag = Off | On
  cast :: (a ~ b) => (a -> a) -> b -> b
  cast f = f
  result = cast (\x -> x) On
status: xfail
reason: Equality lifts through function arguments and results. The System FC printer
  writes the arrow coercion as (->), and the System FC parser does not read it back.