extensions:
  - ExplicitForAll
  - ForeignFunctionInterface
  - GHCForeignImportPrim
  - KindSignatures
  - MagicHash
modules:
  - |
    module Test where
    import GHC.Types (RuntimeRep, TYPE)
    foreign import prim raise# :: forall (r :: RuntimeRep) a (b :: TYPE r). a -> b
    boom x = raise# x
expected: |-
  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Types

  import headers
    2.tLevity :: 2.tType;
    2.tLiftedRep :: 2.tRuntimeRep;
    2.tRuntimeRep :: 2.tType;
    2.tTYPE :: ∀(rep : 2.tRuntimeRep). 2.tType;
    2.tType :: 2.tType;
    2.vBoxedRep :: 2.tLevity 2.→ 2.tRuntimeRep;
    2.vLifted :: 2.tLevity

  import synonyms
    2.tLiftedRep = 2.vBoxedRep 2.vLifted;
    2.tType = 2.tTYPE 2.tLiftedRep

  pub val 1.vboom :: ∀(a : 2.tType) (b : 2.tType). a 2.→ b
   = Λ(a : 2.tType).
    Λ(b : 2.tType).
      λ(x : a).
        foreign {prim 1.vraise# :: ∀(r : 2.tRuntimeRep) (a{1} : 2.tType) (b{1} : 2.tTYPE r). FUN @2.tLiftedRep @r a{1} b{1}} @(2.vBoxedRep 2.vLifted) @a @b x
status: pass
reason: A use of a foreign import prim stays an ordinary application.
