modules:
- |
  module Test where

  import GHC.Prim (Int#)

  data Int = I# Int#
  newtype Wrap = Wrap Int

  unwrapAll :: [Wrap] -> [Int]
  unwrapAll ws = [ n | Wrap n <- ws ]
