  scope 1 = "" Test
  scope 2 = "aihc-prim" GHC.Prim
  scope 3 = "aihc-prim" GHC.Types

  import headers
    2.tInt# :: 3.tTYPE 3.vIntRep;
    3.tLevity :: 3.tType;
    3.tLiftedRep :: 3.tRuntimeRep;
    3.tRuntimeRep :: 3.tType;
    3.tTYPE :: ∀(rep : 3.tRuntimeRep). 3.tType;
    3.tType :: 3.tType;
    3.t[] :: ∀(a : 3.tType). 3.tType;
    3.v: :: ∀(a : 3.tType). a 3.→ 3.t[] a 3.→ 3.t[] a;
    3.vBoxedRep :: 3.tLevity 3.→ 3.tRuntimeRep;
    3.vIntRep :: 3.tRuntimeRep;
    3.vLifted :: 3.tLevity;
    3.v[] :: ∀(a : 3.tType). 3.t[] a

  import synonyms
    3.tLiftedRep = 3.vBoxedRep 3.vLifted;
    3.tType = 3.tTYPE 3.tLiftedRep

  pub type 1.tInt :: 3.tType {
      pub 1.vI# :: FUN @3.vIntRep @3.tLiftedRep 2.tInt# 1.tInt
  }

  pub type 1.tWrap :: 3.tType {}

  axiom 1.$ax$Wrap : 1.tWrap ~R 1.tInt

  pub val 1.vunwrapAll :: 3.t[] 1.tWrap 3.→ 3.t[] 1.tInt
   = λ(x : 3.t[] 1.tWrap).
    rec {
        _list_comp : 3.t[] 1.tWrap 3.→ 3.t[] 1.tInt =
            λ(_list_comp_list : 3.t[] 1.tWrap).
              case _list_comp_list as (_list_comp_scrut : 3.t[] 1.tWrap) return (3.t[] 1.tInt) of {
                  3.v[] →
                      3.v[] @1.tInt;
                  3.v: (_pat : 1.tWrap) (_list_comp_tail : 3.t[] 1.tWrap) →
                      let {
                          n : 1.tInt =
                              _pat ▷ axiom-co 1.$ax$Wrap
