extensions:
- ExistentialQuantification
source: |
  module Test where
  import GHC.Prim
  data Box = forall a. Box a
  copyBox :: Box -> Box
  copyBox box = case box of
    Box value -> Box value
expected: |-
  scope 1 = "" Test

  constructor 1.Box [BoxedRep Lifted]

  global 1.copyBox = (P$copyBox/1)

  $copyBox (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    case_value :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (x :: BoxedRep Lifted)
    case (case_value :: BoxedRep Lifted) as _scrut :: BoxedRep Lifted of
      data 1.Box (value :: BoxedRep Lifted) ->
        store (C1.Box (value :: BoxedRep Lifted))
status: pass
reason: preserves the lifted representation of an existential constructor field
