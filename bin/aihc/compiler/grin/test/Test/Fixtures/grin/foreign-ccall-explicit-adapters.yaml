extensions:
- ForeignFunctionInterface
- MagicHash
- UnboxedTuples
source: |
  module Test where
  import GHC.Prim (Int#, RealWorld, State#)
  data Int = I# Int#
  newtype IO a = IO (State# RealWorld -> (# State# RealWorld, a #))
  foreign import ccall unsafe "identity_int" identityInt :: Int -> IO Int

  run :: Int -> IO Int
  run x = identityInt x
expected: |-
  scope 1 = "" Test

  constructor 1.I# [IntRep]

  foreign 1.identityInt = "identity_int" :: (int) -> int ! real-world

  global 1.run = (P$run/1)

  $run_identityInt_foreign (foreign_argument_0 :: BoxedRep Lifted) -> TupleRep [TupleRep [],BoxedRep Lifted] =
    foreign_box :: BoxedRep Lifted <-
      eval @(BoxedRep Lifted) (foreign_argument_0 :: BoxedRep Lifted)
    case (foreign_box :: BoxedRep Lifted) as foreign_box_case :: BoxedRep Lifted of
      data 1.I# (foreign_field :: IntRep) ->
        foreign_result :: IntRep <-
          foreign-call 1.identityInt = "identity_int" :: (int) -> int ! real-world with (foreign_field :: IntRep)
        store (C1.I# (foreign_result :: IntRep))

  $run (x :: BoxedRep Lifted) -> BoxedRep Lifted =
    store (P$run_identityInt_foreign/[[]] (x :: BoxedRep Lifted))
reason: uses only the adapters named by the System FC foreign call
status: pass
