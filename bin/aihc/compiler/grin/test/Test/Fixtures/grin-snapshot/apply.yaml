entry: $entry
program: |
  constructor I32#/1 [Int32Rep]
  constructor Pair/2 [BoxedRep Lifted, BoxedRep Lifted]

  $identity (argument%1 :: BoxedRep Lifted) -> BoxedRep Lifted =
    constant (argument%1 :: BoxedRep Lifted)

  $entry -> BoxedRep Lifted =
    (closure%2 :: BoxedRep Lifted) <- store (P$identity/1)
    (value%3 :: BoxedRep Lifted) <- store (CI32# (9 :: Int32Rep))
    (applied%4 :: BoxedRep Lifted) <- apply @(BoxedRep Lifted) (closure%2 :: BoxedRep Lifted) (value%3 :: BoxedRep Lifted)
    store (CPair (closure%2 :: BoxedRep Lifted) (applied%4 :: BoxedRep Lifted))
return: "@0"
heap: |
  @0 = CPair @1 @2
  @1 = P$identity/1
  @2 = CI32# 9
allocations:
  macos-arm64: 4
  linux-amd64: 4
status: pass
reason: GrinApply enters a stored closure that is already in WHNF without requiring GrinEval to change its heap pointer
lir-externs:
  - aihc_lir_apply_p
  - aihc_lir_continue_p
lir-absent-functions:
  - aihc_lir_eval
  - aihc_lir_resume
  - aihc_lir_continue_p
  - aihc_lir_continue_i
  - aihc_lir_continue_
  - aihc_lir_apply_p
  - aihc_lir_apply_i
  - aihc_lir_apply_
  - aihc_lir_continue_slot
  - aihc_lir_apply_slot
