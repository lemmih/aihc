name: Nix Flake Check

on:
  pull_request:
  merge_group:
  workflow_dispatch:

# A new push to a pull request cancels the runs of the same workflow that are
# still queued or in progress for that pull request. Merge queue runs always
# complete: each merge group gets its own ref, and cancelling one would stall
# the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  select-runner:
    runs-on: ubuntu-24.04
    outputs:
      use_self_hosted: ${{ steps.select.outputs.use_self_hosted }}
      runs_on: ${{ steps.select.outputs.runs_on }}
      selected_runner: ${{ steps.select.outputs.selected_runner }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: select
        uses: ./.github/actions/select-ci-runner
        with:
          repository: ${{ github.repository }}
          runner-label: ${{ vars.CI_NIX_CHECK_RUNNER_LABEL != '' && vars.CI_NIX_CHECK_RUNNER_LABEL || (vars.CI_SELF_HOSTED_RUNNER_LABEL != '' && vars.CI_SELF_HOSTED_RUNNER_LABEL || 'aihc-nix') }}
          fallback-runner: ${{ vars.CI_HOSTED_FALLBACK_RUNNER != '' && vars.CI_HOSTED_FALLBACK_RUNNER || 'ubuntu-24.04' }}
          runner-token: ${{ secrets.SELF_HOSTED_RUNNER_ADMIN_TOKEN != '' && secrets.SELF_HOSTED_RUNNER_ADMIN_TOKEN || secrets.AUTOMATION_PR_TOKEN }}
          allow-self-hosted: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Summarize runner selection
        run: |
          {
            echo "### Runner selection"
            echo
            echo "- Selected runner: \`${{ steps.select.outputs.selected_runner }}\`"
            echo "- Self-hosted enabled: \`${{ steps.select.outputs.use_self_hosted }}\`"
            echo "- Reason: ${{ steps.select.outputs.reason }}"
          } >>"$GITHUB_STEP_SUMMARY"

  flake-check:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix CI
        uses: ./.github/actions/setup-nix-ci
        with:
          r2-account-id: ${{ vars.R2_ACCOUNT_ID }}
          r2-access-key: ${{ vars.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          nix-cache-private-key: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
          nix-preinstalled: ${{ needs.select-runner.outputs.use_self_hosted }}

      - name: Free self-hosted Nix store space when disk use is high
        if: needs.select-runner.outputs.use_self_hosted == 'true'
        run: |
          disk_use="$(df --output=pcent /nix/store | tail -n 1 | tr -dc '0-9')"
          if (( disk_use >= 80 )); then
            nix store gc
          else
            echo "Nix store disk use is ${disk_use}%. Skip garbage collection."
          fi

      - name: Run flake checks
        run: nix flake check --max-jobs 4 --print-build-logs
