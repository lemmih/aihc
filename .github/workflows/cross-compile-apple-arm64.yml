name: Cross Compile apple-arm64

# Compile the examples for apple-arm64 on an amd64 Linux host without linking,
# then link and run them on an arm64 macOS host. A failure opens a GitHub
# issue holding the report, or adds the report to the open issue.

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  TARGET: apple-arm64

jobs:
  compile:
    name: Compile examples on linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The GitHub Actions cache holds the Nix store between weekly runs. The
      # shared R2 cache is cleared weekly, so a run there would rebuild the
      # compiler and the apple-arm64 toolchain every time.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: cross-compile-${{ env.TARGET }}-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/*.cabal', 'cabal.project') }}
          restore-prefixes-first-match: cross-compile-${{ env.TARGET }}-${{ runner.os }}-
          gc-max-store-size-linux: 6G

      - name: Cross-compile the examples
        run: |
          set -o pipefail
          nix build ".#cross-examples-$TARGET" --print-build-logs --out-link cross-examples 2>&1 | tee compile.log

      - name: Summarize compilation
        run: |
          {
            echo "### Compilation for $TARGET"
            echo
            for bundle in cross-examples/*/; do
              echo "- $(basename "$bundle"): $(<"$bundle/status")"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Pack the bundles
        # tar keeps the hard links that make identical archives share one copy.
        run: tar -C cross-examples -cf cross-examples.tar .

      - name: Upload the bundles
        uses: actions/upload-artifact@v7
        with:
          name: cross-examples-${{ env.TARGET }}
          path: cross-examples.tar
          retention-days: 7
          if-no-files-found: error

      - name: Upload the compile log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-log-${{ env.TARGET }}
          path: compile.log
          retention-days: 7
          if-no-files-found: ignore

  link-and-run:
    name: Link and run on apple-arm64
    needs: compile
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: cross-examples-${{ env.TARGET }}

      - name: Unpack the bundles
        run: |
          mkdir cross-examples
          tar -C cross-examples -xf cross-examples.tar

      - name: Link and run the examples
        run: scripts/link-and-run-example-bundles.sh cross-examples results

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ env.TARGET }}
          path: results
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Open a failure report
    needs:
      - compile
      - link-and-run
    if: always() && (needs.compile.result != 'success' || needs.link-and-run.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Write the report
        run: |
          if [[ -f "artifacts/cross-examples-$TARGET/cross-examples.tar" ]]; then
            mkdir cross-examples
            tar -C cross-examples -xf "artifacts/cross-examples-$TARGET/cross-examples.tar"
          fi
          scripts/cross-compile-report.sh \
            report.md \
            "$TARGET" \
            cross-examples \
            "artifacts/results-$TARGET" \
            "artifacts/compile-log-$TARGET/compile.log"
          cat report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Cross-compilation failure: $TARGET"
          # An issue body holds at most 65536 characters; the run link at the
          # top of the report leads to the full logs.
          if (( $(wc -c <report.md) > 60000 )); then
            head -c 60000 report.md >body.md
            printf '\n\n[... report truncated, see the run for the full logs ...]\n' >>body.md
          else
            cp report.md body.md
          fi
          gh label create cross-compile --description "Weekly cross-compilation failures" --color D93F0B --force
          existing=$(gh issue list --state open --label cross-compile --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file body.md
            echo "Added the report to issue #$existing" >>"$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$title" --label cross-compile --body-file body.md
          fi
