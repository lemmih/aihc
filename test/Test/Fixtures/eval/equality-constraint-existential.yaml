extensions:
- GADTs
- TypeOperators
modules:
- |
  module Test where
  data Flag = Off | On
  data Box where
    Box :: (a ~ Flag) => a -> Box
  unbox :: Box -> Flag
  unbox (Box x) = x
  result = unbox (Box On)
expression: result
output: |
  On
status: xfail
reason: An existential constructor preserves equality evidence for its field. AIHC cannot resolve
  the equality class. AIHC still lacks complete equality support.

evaluators:
- grin
