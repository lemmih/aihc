extensions:
  - MagicHash
  - UnboxedTuples
modules:
  - |
    module Test where
    import GHC.Prim (State#, RealWorld, catch#, raise#, realWorld#)

    successful :: State# RealWorld -> (# State# RealWorld, Int #)
    successful s = (# s, 42 #)

    failingHandler :: Bool -> State# RealWorld -> (# State# RealWorld, Int #)
    failingHandler = raise# True
output: |
  I# 42
expression: |
  case catch# successful failingHandler realWorld# of
    (# _, x #) -> x
status: pass
