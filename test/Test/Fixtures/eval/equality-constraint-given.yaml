extensions:
- GADTs
- TypeOperators
modules:
- |
  module Test where
  data Flag = Off | On
  cast :: (a ~ b) => a -> b
  cast x = x
  result = cast On :: Flag
expression: result
output: |
  On
status: xfail
reason: A given equality permits a nominal cast. AIHC cannot resolve the equality class.
evaluators:
- grin
