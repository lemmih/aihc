extensions:
- GADTs
- TypeOperators
- DataKinds
- KindSignatures
- PolyKinds
modules:
- |
  {-# LANGUAGE PolyKinds #-}
  module Test where
  data Flag = Off | On
  data Proxy a = Proxy
  cast :: (a ~ 'On) => Proxy a -> Flag
  cast _ = On
  result = cast (Proxy :: Proxy 'On)
expression: result
output: |
  On
status: pass

evaluators:
- grin
