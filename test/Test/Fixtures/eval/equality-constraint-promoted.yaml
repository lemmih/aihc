extensions:
- GADTs
- TypeOperators
- DataKinds
- KindSignatures
- PolyKinds
modules:
- |
  module Test where
  data Flag = Off | On
  data Proxy a = Proxy
  cast :: (a ~ 'On) => Proxy a -> Flag
  cast _ = On
  result = cast (Proxy :: Proxy 'On)
expression: result
output: |
  On
status: xfail
reason: Equality can relate promoted data constructors. AIHC still lacks complete equality support.

evaluators:
- grin
