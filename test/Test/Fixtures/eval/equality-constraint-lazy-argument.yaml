extensions:
- GADTs
- TypeOperators
modules:
- |
  module Test where
  data Flag = Off | On
  keep :: (a ~ b) => a -> b -> b
  keep _ y = y
  loop :: Flag
  loop = loop
  result = keep loop On
expression: result
output: |
  On
status: pass
reason: Equality evidence must not force an unused value.

evaluators:
- grin
