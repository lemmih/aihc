extensions:
- GADTs
- TypeOperators
- ExplicitNamespaces
modules:
- |
  module Test where
  import GHC.Types (type (~))
  data Flag = Off | On
  cast :: (a ~ b) => a -> b
  cast x = x
  result = cast On :: Flag
expression: result
output: |
  On
status: xfail
reason: An explicit type import exposes the equality class. AIHC cannot resolve the equality class.
evaluators:
- grin
