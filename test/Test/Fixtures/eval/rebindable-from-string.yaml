extensions:
  - OverloadedStrings
  - RebindableSyntax
modules:
  - |
    {-# LANGUAGE OverloadedStrings, RebindableSyntax #-}
    module Test where

    import Prelude (Bool (..))

    fromString _ = True

    text :: Bool
    text = "hello"
output: |
  True
expression: |
  text
status: pass
reason: RebindableSyntax with OverloadedStrings gives a string literal the in-scope fromString
