extensions:
- GADTs
- TypeOperators
modules:
- |
  module Test where
  data Flag = Off | On
  cast :: ([a] ~ [b]) => a -> b
  cast x = x
  result = cast On :: Flag
expression: result
output: |
  On
status: xfail
reason: List equality gives equality of the element types. AIHC still lacks complete equality support.

evaluators:
- grin
