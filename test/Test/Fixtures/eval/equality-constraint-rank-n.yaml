extensions:
- GADTs
- TypeOperators
- RankNTypes
modules:
- |
  module Test where
  data Flag = Off | On
  use :: (forall a b. (a ~ b) => a -> b) -> Flag
  use f = f On
  cast :: (a ~ b) => a -> b
  cast x = x
  result = use cast
expression: result
output: |
  On
status: xfail
reason: A higher-rank argument can require equality evidence. AIHC cannot resolve the equality class.
evaluators:
- grin
