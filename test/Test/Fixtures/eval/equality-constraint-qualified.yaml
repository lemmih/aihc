extensions:
- GADTs
- TypeOperators
modules:
- |
  module Test where
  import qualified GHC.Types as T
  data Flag = Off | On
  cast :: (a T.~ b) => a -> b
  cast x = x
  result = cast On :: Flag
expression: result
output: |
  On
status: xfail
reason: A qualified equality class has the same meaning as equality syntax. AIHC cannot resolve the
  equality class.
evaluators:
- grin
