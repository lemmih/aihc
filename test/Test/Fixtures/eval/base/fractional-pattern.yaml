extensions: []
modules:
  - |
    module Test where

    classify :: Double -> Int
    classify 1.5 = 1
    classify (-2.5) = 2
    classify _ = 0

    describe :: Float -> Bool
    describe value =
      case value of
        0.25 -> True
        _ -> False

    values :: (Int, Int, Int, Bool, Bool)
    values = (classify 1.5, classify (-2.5), classify 2.5, describe 0.25, describe 0.5)
output: |
  ((I# 1),(I# 2),(I# 0),True,False)
expression: |
  values
status: pass
reason: a fractional literal pattern converts with fromRational and compares
  with the equality method of the scrutinee type
