extensions:
  - KindSignatures
modules:
  - |
    module Test where

    import Data.Functor.Classes
    import Data.Functor.Identity (Identity (..))
    import Data.Kind (Type)
    import Data.List.NonEmpty (NonEmpty (..))
    import Prelude

    newtype Wrap (f :: Type -> Type) a = Wrap (f a)

    instance (Eq1 f) => Eq1 (Wrap f) where
      liftEq eq (Wrap x) (Wrap y) = liftEq eq x y

    instance (Ord1 f) => Ord1 (Wrap f) where
      liftCompare comp (Wrap x) (Wrap y) = liftCompare comp x y

    instance (Read1 f) => Read1 (Wrap f) where
      liftReadsPrec rp rl = readsData (readsUnaryWith (liftReadsPrec rp rl) "Wrap" Wrap)

    instance (Show1 f) => Show1 (Wrap f) where
      liftShowsPrec sp sl d (Wrap x) = showsUnaryWith (liftShowsPrec sp sl) "Wrap" d x

    instance (Eq1 f, Eq a) => Eq (Wrap f a) where
      (==) = eq1
      left /= right = not (eq1 left right)

    instance (Ord1 f, Ord a) => Ord (Wrap f a) where
      compare = compare1
      left < right = compare1 left right == LT
      left <= right = compare1 left right /= GT
      left > right = compare1 left right == GT
      left >= right = compare1 left right /= LT
      max left right = if compare1 left right == LT then right else left
      min left right = if compare1 left right == GT then right else left

    instance (Read1 f, Read a) => Read (Wrap f a) where
      readsPrec = readsPrec1

    instance (Show1 f, Show a) => Show (Wrap f a) where
      showsPrec = showsPrec1

    fullyReads :: (Read a, Eq a) => a -> String -> Bool
    fullyReads expected input =
      case reads input of
        [(actual, rest)] -> actual == expected && null rest
        _ -> False

    checks :: [Bool]
    checks =
      [ eq1 (Just (1 :: Int)) (Just 1),
        not (eq1 (Just (1 :: Int)) Nothing),
        eq1 [1 :: Int, 2] [1, 2],
        not (eq1 [1 :: Int] [1, 2]),
        compare1 (Just (1 :: Int)) (Just 2) == LT,
        compare1 (Nothing :: Maybe Int) (Just 2) == LT,
        compare1 [2 :: Int] [1, 5] == GT,
        eq2 (Left 1 :: Either Int Bool) (Left 1),
        compare2 (Right True :: Either Int Bool) (Left 3) == GT,
        compare2 (1 :: Int, 2 :: Int) (1, 1) == GT,
        eq1 (Identity 'x') (Identity 'x'),
        compare1 (3 :: Int, 7 :: Int) (3, 8) == LT,
        eq1 (1 :| [2 :: Int]) (1 :| [2]),
        compare1 (1 :| [2 :: Int]) (1 :| [3]) == LT,
        showsPrec1 11 (Just (3 :: Int)) "" == "(Just 3)",
        showsPrec1 0 [Just (3 :: Int), Nothing] "" == "[Just 3,Nothing]",
        showsPrec2 0 (Left 'a' :: Either Char Int) "" == "Left 'a'",
        showsPrec2 0 (1 :: Int, Just True) "" == "(1,Just True)",
        showsPrec1 0 (Identity (-1 :: Int)) "" == "Identity (-1)",
        showsPrec1 6 (1 :| [2 :: Int]) "" == "(1 :| [2])",
        show (Wrap (Just (2 :: Int))) == "Wrap (Just 2)",
        show (Wrap [Wrap (Just 'a')]) == "Wrap [Wrap (Just 'a')]",
        fullyReads (Wrap (Just (2 :: Int))) "Wrap (Just 2)",
        fullyReads (Wrap [Just 'a', Nothing]) " Wrap [Just 'a', Nothing]",
        fullyReads (Wrap (Right 'q' :: Either Int Char)) "(Wrap (Right 'q'))",
        fullyReads (Wrap (Identity True)) "Wrap (Identity True)",
        fullyReads (Wrap (1 :| [2 :: Int])) "Wrap (1 :| [2])",
        fullyReads (Wrap (3 :: Int, False)) "Wrap (3, False)",
        Wrap (Just (1 :: Int)) < Wrap (Just 2),
        Wrap [Just (1 :: Int)] == Wrap [Just 1]
      ]

    failures :: [Int]
    failures = [index | (index, False) <- zip [0 ..] checks]
output: |
  []
expression: |
  failures
status: pass
reason: Data.Functor.Classes lifts Eq, Ord, Read, and Show through unary and binary constructors
