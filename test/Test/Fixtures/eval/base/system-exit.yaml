    module Main where

    import Control.Exception (SomeException, try)
    import GHC.TopHandler
    import System.Exit (ExitCode(..), exitWith)

    catchesExitCode :: IO Bool
    catchesExitCode = do
      result <- try (exitWith (ExitFailure 5) :: IO ())
      case result of
        Left (ExitFailure 5) -> return True
        _ -> return False

    apiRunMainIO :: IO a -> IO a
    apiRunMainIO = runMainIO

