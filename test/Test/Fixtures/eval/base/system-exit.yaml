    apiTopHandler = topHandler

    apiTopHandlerFastExit :: SomeException -> IO a
    apiTopHandlerFastExit = topHandlerFastExit

    apiReportError :: SomeException -> IO ()
    apiReportError = reportError

    apiReportStackOverflow :: IO ()
    apiReportStackOverflow = reportStackOverflow

    apiFlushStdHandles :: IO ()
    apiFlushStdHandles = flushStdHandles

    readsExitCode :: Bool
    readsExitCode =
      case reads "ExitFailure 7" of
        [(ExitFailure 7, "")] -> True
        _ -> False

    result :: IO Bool
    result = do
      catches <- catchesExitCode
      return
        ( catches
            && ExitSuccess < ExitFailure 1
            && show ExitSuccess == "ExitSuccess"
            && show (ExitFailure 7) == "ExitFailure 7"
            && readsExitCode
