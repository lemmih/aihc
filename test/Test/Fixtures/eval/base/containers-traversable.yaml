  - |
    module Test where
    import Data.Traversable (mapAccumL, mapAccumR, foldMapDefault)

    step :: Int -> Int -> (Int, Int)
    step s x = (s + x, s)

    checks = and
      [ mapAccumL step 0 [1, 2, 3] == (6, [0, 1, 3])
      , mapAccumR step 0 [1, 2, 3] == (6, [5, 3, 0])
      , mapAccumL step 9 [] == (9, [])
      , mapAccumR step 9 [] == (9, [])
      , mapAccumL step 2 (Just 3) == (5, Just 2)
      , foldMapDefault (\x -> [x, x]) [1, 2, 3 :: Int] == [1, 1, 2, 2, 3, 3]
      , foldMapDefault (\x -> [x]) (Nothing :: Maybe Int) == []
      ]
