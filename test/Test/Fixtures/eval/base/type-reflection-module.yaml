modules:
  - |
    module Test where

    import Data.Proxy (Proxy (..))
    import Data.Typeable qualified as Typeable
    import GHC.Types (TrName (..))
    import Type.Reflection (Module (..), TypeRep, typeRep)
    import Type.Reflection qualified as Reflection

    class NFData a where
      rnf :: a -> ()

    instance NFData Typeable.TypeRep where
      rnf value = Typeable.rnfTypeRep value

    instance NFData Reflection.TyCon where
      rnf value = Reflection.rnfTyCon value

    instance NFData (TypeRep a) where
      rnf value = Reflection.rnfTypeRep value

    instance NFData Module where
      rnf value = Reflection.rnfModule value

    moduleValue :: Module
    moduleValue = Module (TrNameD "base") (TrNameD "Type.Reflection")

    boolRep :: TypeRep Bool
    boolRep = typeRep (Proxy :: Proxy Bool)

    result :: Bool
    result =
      case rnf moduleValue of
        () ->
          case rnf boolRep of
            () ->
              case rnf (Typeable.typeRep (Proxy :: Proxy Bool)) of
                () -> True
output: |
  True
