extensions:
  - RebindableSyntax
modules:
  - |
    {-# LANGUAGE RebindableSyntax #-}
    module Test where

    import Prelude (Bool (..), Eq (..))

    fromInteger _ = ()

    ifThenElse _ _ _ = ()

    data Color = Red | Green | Blue deriving (Eq)
output: |
  (True,False)
expression: |
  (Red == Red, Red == Blue)
status: pass
reason: derived Eq under RebindableSyntax uses the built-in Bool and Eq rather than the rebound names
