extensions:
- GADTs
- TypeOperators
modules:
- |
  module Test where
  data Flag = Off | On
  witness :: (a ~ [a]) => [a]
  witness = []
  result = witness
status: pass
reason: A finite type cannot equal a list of itself.

annotated:
- |
  module Test where
  data Flag = Off | On
       │      │     └─ type: Flag
       │      └─ type: Flag
       └─ type: Type
  witness :: (a ~ [a]) => [a]
  witness = []
  │         └─ type: [a]; type-args: a
  └─ type: ∀ a. (a ~ [a]) ⇒ [a]
  result = witness
           └─ error: couldn't match t0 with [t0]
