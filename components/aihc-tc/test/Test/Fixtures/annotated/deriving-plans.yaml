modules:
- |
  {-# LANGUAGE DeriveAnyClass, DerivingStrategies, DerivingVia, GeneralizedNewtypeDeriving, KindSignatures #-}
  module Main where
  import GHC.Types (Type)
  class C a where
    c :: a -> a
  class D a where
  class HK (f :: Type -> Type) where
  data Wrapper a = Wrapper a
  data T a = T a
    deriving anyclass C
    deriving anyclass HK
    deriving D via Wrapper a
  newtype N a = N a
    deriving newtype C
  newtype PreferAnyclass a = PreferAnyclass a
    deriving C
  data Default a = Default a
    deriving C
reason: deriving clauses become typed plans with effective strategies but without
  generated declarations
