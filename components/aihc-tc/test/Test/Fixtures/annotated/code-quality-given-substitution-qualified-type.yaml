modules:
- |
  {-# LANGUAGE FlexibleContexts, FlexibleInstances, GADTs, RankNTypes #-}
  module Test where
  data Flag = Off | On
  data Answer = Answer
  data Holder t = Holder
  class Small a where
    small :: a -> Answer
  class Render a where
    render :: a -> Answer
  instance Render (Holder (Small Flag => Flag -> Answer)) where
    render _ = Answer
  data Tag a where
    FlagTag :: Tag Flag
  use :: Tag a -> Holder (Small a => a -> Answer) -> Answer
  use FlagTag holder = render holder
