modules:
- |
  {-# LANGUAGE GeneralizedNewtypeDeriving, DerivingStrategies, TypeFamilies, KindSignatures, MultiParamTypeClasses #-}
  module Main where
  import GHC.Types (Type)
  type family F a
  data Hidden a = Hidden (F a)
  class Direct a where
    direct :: a -> F a
  class Indirect a where
    indirect :: a -> Hidden a
  class Variable (f :: Type -> Type) a where
    variable :: a -> f a
  newtype N a = N a
    deriving newtype (Direct, Indirect)
  newtype V (f :: Type -> Type) a = V a
    deriving newtype (Variable f)
reason: reject casts through families, indirect nominal fields, and unknown type constructors
