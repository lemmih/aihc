extensions:
  - DataKinds
  - KindSignatures
modules:
  - |
    module Test where
    import GHC.Types
    data Color = Red
    data BadApplication (a :: Color Type)
    data BadField (r :: RuntimeRep) = BadField r
annotated:
- |-
  module Test where
  └─ error: kind mismatch: expected Type, got RuntimeRep
  └─ error: kind mismatch: expected Type, got Type → Type
  └─ error: kind mismatch: expected Type, got Type → Type
  import GHC.Types
  data Color = Red
       │       └─ type: Color
       └─ type: Type
  data BadApplication (a :: Color Type)
       └─ type: Color Type → Type
  data BadField (r :: RuntimeRep) = BadField r
       │                            └─ type: ∀ r. r → BadField r
       └─ type: GHC.Types.RuntimeRep → Type
status: pass
reason: rejects invalid kind applications and fields whose types have no runtime representation
