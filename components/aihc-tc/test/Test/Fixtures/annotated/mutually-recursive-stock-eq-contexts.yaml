  │    │          └─ type: ∀ a b. b → Expr a b → Stmt a b
  │    └─ type: Type → Type → Type
  └─ deriving plans: stock Eq (Stmt a b) [context: Eq b, Eq a] [methods: ==, /=]
    deriving stock Eq
                   └─ $fEqStmtab ∷ ∀ b a. (Eq b, Eq a) ⇒ Eq (Stmt a b)
                   └─ type: b → b → GHC.Types.Bool; type-args: b; evidence: given Eq b
                   └─ == ∷ Stmt a b → Stmt a b → Bool
