  │    │          └─ type: ∀ a b. a → Expr a b
  │    └─ type: Type → Type → Type
  └─ deriving plans: stock Eq (Expr a b) [context: Eq a, Eq b] [methods: ==, /=]
    deriving stock Eq
                   └─ $fEqExprab ∷ ∀ a b. (Eq a, Eq b) ⇒ Eq (Expr a b)
                   └─ type: a → a → GHC.Types.Bool; type-args: a; evidence: given Eq a
                   └─ == ∷ Expr a b → Expr a b → Bool
                   └─ type: a
                   └─ type: Expr a b
                   └─ type: a
                   └─ type: Expr a b
                   └─ type: Stmt a b → Stmt a b → GHC.Types.Bool; type-args: Stmt a b; evidence: $fEqStmtab @b @a (given Eq b, given Eq a)
                   └─ type: Expr a b
                   └─ type: Stmt a b
