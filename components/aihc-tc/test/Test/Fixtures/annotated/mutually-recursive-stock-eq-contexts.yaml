                   └─ type: Stmt a b
                   └─ type: GHC.Types.Bool
                   └─ type: Stmt a b
                   └─ type: GHC.Types.Bool
                   └─ type: GHC.Types.Bool
  data Alt a b = Alt (Expr a b) (Stmt a b)
  │    │         └─ type: ∀ a b. Expr a b → Stmt a b → Alt a b
  │    └─ type: Type → Type → Type
  └─ deriving plans: stock Eq (Alt a b) [context: Eq a, Eq b] [methods: ==, /=]
    deriving stock Eq
                   └─ $fEqAltab ∷ ∀ a b. (Eq a, Eq b) ⇒ Eq (Alt a b)
