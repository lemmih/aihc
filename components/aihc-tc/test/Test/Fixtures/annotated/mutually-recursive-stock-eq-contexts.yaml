                   └─ type: Stmt a b → Stmt a b → GHC.Types.Bool; type-args: Stmt a b; evidence: $fEqStmtab @b @a (given Eq b, given Eq a)
                   └─ type: Alt a b → Alt a b → GHC.Types.Bool; type-args: Alt a b; evidence: $fEqAltab @a @b (given Eq a, given Eq b)
                   └─ type: Stmt a b
                   └─ type: Expr a b
                   └─ type: Stmt a b
                   └─ type: Expr a b
                   └─ type: Stmt a b
