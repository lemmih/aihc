extensions:
- DerivingStrategies
modules:
- |
  {-# LANGUAGE DerivingStrategies #-}
  module Main where
  import GHC.Classes (Eq)
  data Expr a b = Lit a | Block (Stmt a b)
    deriving stock Eq
  data Stmt a b = Bind b (Expr a b) | Seq (Stmt a b) (Alt a b)
    deriving stock Eq
  data Alt a b = Alt (Expr a b) (Stmt a b)
    deriving stock Eq
reason: stock Eq contexts for a mutually recursive group are inferred as one batch,
  so each plan is solved once instead of once per path through the group
status: pass
