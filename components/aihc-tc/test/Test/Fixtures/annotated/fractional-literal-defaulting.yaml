modules:
- |
  module GHC.Num where
  import GHC.Prim (Int#)
  import GHC.Types (Int (..))
  data Integer = IS Int#
  data Double = D# Int#
  data Float = F# Int#
  class Num a where
    fromInteger :: Integer -> a
  instance Num Integer where
    fromInteger x = x
  instance Num Double where
    fromInteger (IS x) = D# x
  instance Num Float where
    fromInteger (IS x) = F# x
- |
  module GHC.Real where
  import GHC.Num (Double, Float, Integer, Num (..))
  data Ratio a = Ratio a a
  type Rational = Ratio Integer
  class Num a => Fractional a where
    fromRational :: Rational -> a
  instance Fractional Double where
    fromRational (Ratio x _) = fromInteger x
  instance Fractional Float where
    fromRational (Ratio x _) = fromInteger x
- |
  module Main where
  import GHC.Num (Float)
  import GHC.Real (Fractional)
  import GHC.Types (Bool (..))
  small :: Float
  small = 2.5
  ignore :: Fractional a => a -> Bool
  ignore _ = True
  defaulted :: Bool
  defaulted = ignore 1.5
reason: a fractional literal applies fromRational, so a signature can give it Float
  and an ambiguous literal defaults to Double
status: pass
