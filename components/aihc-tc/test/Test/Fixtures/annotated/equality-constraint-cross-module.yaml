extensions:
- GADTs
- TypeOperators
modules:
- |
  module Proof where
  cast :: (a ~ b) => a -> b
  cast x = x
- |
  module Test where
  import Proof (cast)
  data Flag = Off | On
  result = cast On :: Flag
status: xfail
reason: An imported signature preserves its equality constraint. AIHC cannot resolve the equality
  class. AIHC still lacks complete equality support.
