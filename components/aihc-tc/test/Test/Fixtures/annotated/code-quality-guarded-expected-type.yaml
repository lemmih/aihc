modules:
- |
  {-# LANGUAGE GADTs #-}
  module Test where
  import GHC.Types (Bool (..))
  data Flag = Off | On
  data Count = One | Two
  data Tag a where
    FlagTag :: Tag Flag
    CountTag :: Tag Count
  pick :: Tag a -> a
  pick tag
    | True = case tag of
        FlagTag -> On
        CountTag -> One
reason: A guarded body gets the expected type, as an unguarded body does.
