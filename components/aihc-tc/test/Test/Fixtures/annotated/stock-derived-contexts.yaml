- |
  {-# LANGUAGE DerivingStrategies #-}
  module Main where
  import GHC.Classes (Eq, Ord)
  class Num a where
  class (Num a, Ord a) => Real a where
    toRational :: a -> a
  newtype Tagged s b = Tagged b
    deriving stock (Eq, Ord)
  data Pair a = Pair a (Tagged a a)
    deriving stock (Eq, Ord)
  instance Num a => Num (Tagged s a) where
  instance Real a => Real (Tagged s a) where
    toRational (Tagged a) = Tagged (toRational a)
  data NoOrd = NoOrd
  data Wrap = Wrap NoOrd
    deriving stock Ord
