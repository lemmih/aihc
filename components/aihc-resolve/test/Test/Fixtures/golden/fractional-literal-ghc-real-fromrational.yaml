annotated:
- |-
  module GHC.Num where
  import GHC.Prim (Int#)
  data Integer = IS Int#
       │         │  └─ t GHC.Prim
       │         └─ v GHC.Num
       └─ t GHC.Num
  class Num a where
        └─ t GHC.Num
    fromInteger :: Integer -> a
    └─ v GHC.Num   └─ t GHC.Num
- |-
  module GHC.Prim where
  data Int#
       └─ t GHC.Prim
- |-
  module GHC.Real where
  import GHC.Num (Integer, Num)
  data Ratio a = Ratio a a
       │         └─ v GHC.Real
       └─ t GHC.Real
  type Rational = Ratio Integer
       │          │     └─ t GHC.Num
       │          └─ t GHC.Real
       └─ t GHC.Real
  class Num a => Fractional a where
        │        └─ t GHC.Real
        └─ t GHC.Num
    fromRational :: Rational -> a
    └─ v GHC.Real   └─ t GHC.Real
- |-
  module Main where
  fromRational x = x
  └─ v Main    │   └─ v 0
               └─ v 0
  half = 0.5
  │      └─ v GHC.Real
  └─ v Main
extensions:
