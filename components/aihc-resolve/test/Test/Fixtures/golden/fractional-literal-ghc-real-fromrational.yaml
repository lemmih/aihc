modules:
- |
  module GHC.Prim where
  data Int#
- |
  module GHC.Num where
  import GHC.Prim (Int#)
  data Integer = IS Int#
  class Num a where
    fromInteger :: Integer -> a
- |
  module GHC.Real where
  import GHC.Num (Integer, Num)
  data Ratio a = Ratio a a
  type Rational = Ratio Integer
  class Num a => Fractional a where
    fromRational :: Rational -> a
- |
  module Main where
  fromRational x = x
  half = 0.5
reason: fractional literals resolve GHC.Real.fromRational by default, even when a
  local fromRational is in scope
