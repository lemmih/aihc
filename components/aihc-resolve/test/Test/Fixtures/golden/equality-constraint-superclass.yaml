extensions:
- GADTs
- TypeOperators
- MultiParamTypeClasses
- ExplicitNamespaces
modules:
- |
  module GHC.Types where
  class a ~ b
  infix 4 ~
- |
  module Main where
  class (a ~ b) => Same a b
annotated:
- |
  module GHC.Types where
  class a ~ b
          └─ t GHC.Types
  infix 4 ~
- |
  module Main where
  class (a ~ b) => Same a b
           │       └─ t Main
           └─ t GHC.Types
status: pass
